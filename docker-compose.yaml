services:
  nginx:
    image: nginx:1.31.7
    ports:
      - "80:80"
    networks:
      - service-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      ml:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    networks:
      - service-network
    environment:
      HTTP_ADDR: ":5000"
      DATABASE_URL: postgres://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@db:5432/${POSTGRES_DB:-credit}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (at least 32 characters) in .env}
      JWT_TTL: ${JWT_TTL:-8h}
      ML_URL: http://ml:5001
      RUB_PER_DM: ${RUB_PER_DM:-49.1}
      APPROVE_THRESHOLD: ${APPROVE_THRESHOLD:-0.25}
      SEED_USER_LOGIN: ${SEED_USER_LOGIN:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      SEED_USER_FULL_NAME: ${SEED_USER_FULL_NAME:-Иванов Иван Александрович}
      SEED_USER_POSITION: ${SEED_USER_POSITION:-Кредитный специалист}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    expose:
      - "5001"
    networks:
      - service-network
    volumes:
      - ml-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - service-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

  db:
    image: postgres:18.6
    expose:
      - "5432"
    networks:
      - service-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
      POSTGRES_DB: ${POSTGRES_DB:-credit}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  service-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  ml-data:
    driver: local
