global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "backend:5000"
  
  - job_name: "decision-monitor"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "decision-monitor:9108"