services:
  prometheus:
    image: prom/prometheus:latest
    container_name: credit-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
    networks:
      - default
      - backend-network

  grafana:
    image: grafana/grafana:latest
    container_name: credit-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - default

  decision-monitor:
    build: ./decision-monitor
    container_name: credit-decision-monitor
    restart: unless-stopped
    expose:
      - "9108"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@db:5432/${POSTGRES_DB:-credit}?sslmode=disable
      RUB_PER_DM: ${RUB_PER_DM:-49.1}
      MONITOR_WINDOW: ${MONITOR_WINDOW:-30d}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      MONITOR_MIN_GROUP_SIZE: "30"
    networks:
      - default
      - backend-network

networks:
  default: {}

  backend-network:
    external: true
    name: credit-decision_service-network

volumes:
  prometheus-data:
  grafana-data: