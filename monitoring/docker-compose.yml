services:
  prometheus:
    image: prom/prometheus:latest
    container_name: credit-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - default
      - backend-network

  grafana:
    image: grafana/grafana:latest
    container_name: credit-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - default

networks:
  default: {}

  backend-network:
    external: true
    name: credit-decision_service-network

volumes:
  prometheus-data:
  grafana-data: